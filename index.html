            const computeDepartmentAssignments = (homerooms, teachersList) => {
        const deptCapacity = Math.ceil(teachersList.length / departments.length);
        const deptAssignments = departments.reduce((acc, dept) => {
          acc[dept] = { name: dept, head: null, members: [] };
          return acc;
        }, {});

        // Identify Grade Head assignments from homerooms
        const gradeHeadTeacherIds = new Set();
        const teacherIdToGradeHeadTitle = {};
        homerooms.forEach(slot => {
          const teacherId = slot.teacher ? slot.teacher.id : slot.assignedTeacher;
          if (slot.classNum === 1 && teacherId) {
            gradeHeadTeacherIds.add(teacherId);
            teacherIdToGradeHeadTitle[teacherId] = `${slot.grade}학년부장`;
          }
        });

        // Map teachers list to prepare for department assignment
        const originalTeachersMap = {};
        teachers.forEach(t => {
          originalTeachersMap[t.id] = t;
        });

        let remainingTeachersForDepts = teachersList.map(t => {
          const isGradeHead = gradeHeadTeacherIds.has(t.id);
          const orig = originalTeachersMap[t.id] || t;
          
          let assignedDept = null;
          if (t.specialtyType === '교장' || t.specialtyType === '교감') {
            assignedDept = '기타/없음';
          } else if (isGradeHead) {
            assignedDept = '학년부';
          } else if (orig.fixedDept) {
            assignedDept = orig.fixedDept;
          }
          
          return {
            ...t,
            headPref: isGradeHead ? teacherIdToGradeHeadTitle[t.id] : orig.headPref,
            assignedDept: assignedDept,
            deptPreferenceRank: isGradeHead || orig.fixedDept || t.specialtyType === '교장' || t.specialtyType === '교감' ? 0 : -1,
            isHeadPosition: isGradeHead ? true : false
          };
        });

        const headTeachers = remainingTeachersForDepts.filter(t => t.role === 'head' || t.role === 'homeroom_head');
        const assignedHeads = new Set();
        // Add Grade Heads to assignedHeads so they cannot be assigned as other department heads
        gradeHeadTeacherIds.forEach(id => {
          assignedHeads.add(id);
          if (deptAssignments['학년부']) {
            deptAssignments['학년부'].members.push(id);
          }
        });
        
        // Also add other pre-assigned teachers to their respective departments
        teachersList.forEach(t => {
          const orig = originalTeachersMap[t.id] || t;
          if (orig.fixedDept && !gradeHeadTeacherIds.has(t.id) && orig.specialtyType !== '교장' && orig.specialtyType !== '교감') {
            if (deptAssignments[orig.fixedDept]) {
              deptAssignments[orig.fixedDept].members.push(t.id);
            }
          }
        });

        positions.forEach(pos => {
          const targetDept = pos.dept;
          if (!targetDept || targetDept === '기타/없음' || !deptAssignments[targetDept]) return;

          const applicants = headTeachers.filter(t => t.headPref === pos.name && !assignedHeads.has(t.id));
          if (applicants.length > 0) {
            applicants.sort((a, b) => {
              const bHead = parseInt(b.tenureHead) || 0;
              const aHead = parseInt(a.tenureHead) || 0;
              if (bHead !== aHead) return bHead - aHead;
              const bSchool = parseInt(b.tenureSchool) || 0;
              const aSchool = parseInt(a.tenureSchool) || 0;
              if (bSchool !== aSchool) return bSchool - aSchool;
              return (parseInt(b.tenureHomeroom) || 0) - (parseInt(a.tenureHomeroom) || 0);
            });

            const selectedHead = applicants[0];
            deptAssignments[targetDept].head = selectedHead.id;
            assignedHeads.add(selectedHead.id);

            remainingTeachersForDepts.forEach(t => {
              if (t.id === selectedHead.id) {
                t.assignedDept = targetDept;
                t.deptPreferenceRank = 0;
                t.isHeadPosition = true;
              }
            });
          }
        });

        const unassignedHeads = headTeachers.filter(h => !assignedHeads.has(h.id));
        unassignedHeads.forEach(teacher => {
          for (let prefDept of teacher.deptPrefs) {
            if (deptAssignments[prefDept] && !deptAssignments[prefDept].head) {
              deptAssignments[prefDept].head = teacher.id;
              assignedHeads.add(teacher.id);

              remainingTeachersForDepts.forEach(t => {
                if (t.id === teacher.id) {
                  t.assignedDept = prefDept;
                  t.deptPreferenceRank = teacher.deptPrefs.indexOf(prefDept);
                  t.isHeadPosition = true;
                }
              });
              break;
            }
          }
        });

        const remainingUnassignedHeads = headTeachers.filter(h => !assignedHeads.has(h.id));
        remainingUnassignedHeads.forEach(teacher => {
          for (let dept of departments) {
            if (!deptAssignments[dept].head) {
              deptAssignments[dept].head = teacher.id;
              assignedHeads.add(teacher.id);

              remainingTeachersForDepts.forEach(t => {
                if (t.id === teacher.id) {
                  t.assignedDept = dept;
                  t.deptPreferenceRank = -1;
                  t.isHeadPosition = true;
                }
              });
              break;
            }
          }
        });

        // Assign non-head teachers based on department preferences (1st to 5th choices)
        for (let choiceIdx = 0; choiceIdx < 5; choiceIdx++) {
          remainingTeachersForDepts.forEach(teacher => {
            if (teacher.assignedDept || assignedHeads.has(teacher.id)) return;

            const preferredDept = teacher.deptPrefs[choiceIdx];
            if (preferredDept && deptAssignments[preferredDept]) {
              const currentCount = deptAssignments[preferredDept].members.length + (deptAssignments[preferredDept].head ? 1 : 0);
              const maxCapacity = deptCapacities[preferredDept] !== undefined ? parseInt(deptCapacities[preferredDept]) || 0 : deptCapacity;
              if (currentCount < maxCapacity) {
                deptAssignments[preferredDept].members.push(teacher.id);
                teacher.assignedDept = preferredDept;
                teacher.deptPreferenceRank = choiceIdx;
              }
            }
          });
        }

        // Assign remaining unassigned teachers to departments
        remainingTeachersForDepts.forEach(teacher => {
          if (teacher.assignedDept || assignedHeads.has(teacher.id)) return;

          let minDept = null;
          let minRatio = 999;

          // Try to find a department that is not full yet relative to its custom capacity
          departments.forEach(dept => {
            const count = deptAssignments[dept].members.length + (deptAssignments[dept].head ? 1 : 0);
            const capacity = deptCapacities[dept] !== undefined ? parseInt(deptCapacities[dept]) || 0 : deptCapacity;
            if (count < capacity) {
              const ratio = count / (capacity || 1);
              if (ratio < minRatio) {
                minRatio = ratio;
                minDept = dept;
              }
            }
          });

          // Fallback: if all departments are full, find the one with the smallest absolute count
          if (!minDept) {
            let minCount = 999;
            departments.forEach(dept => {
              const count = deptAssignments[dept].members.length + (deptAssignments[dept].head ? 1 : 0);
              if (count < minCount) {
                minCount = count;
                minDept = dept;
              }
            });
          }

          if (minDept) {
            deptAssignments[minDept].members.push(teacher.id);
            teacher.assignedDept = minDept;
            teacher.deptPreferenceRank = -1;
          }
        });

        const finalTeachersMap = {};
        remainingTeachersForDepts.forEach(t => {
          finalTeachersMap[t.id] = t;
        });

        const computedDepartments = Object.values(deptAssignments).map(dept => {
          const cap = deptCapacities[dept.name] !== undefined 
            ? parseInt(deptCapacities[dept.name]) || 0 
            : Math.ceil(teachersList.length / departments.length);
          return {
            ...dept,
            capacity: cap,
            headTeacher: finalTeachersMap[dept.head] || null,
            memberTeachers: dept.members.map(mid => finalTeachersMap[mid])
          };
        });

        return {
          departments: computedDepartments,
          teachers: remainingTeachersForDepts
        };
      };

      const computeAssignmentReasons = (homerooms, teachersList) => {
        const getCareerScore = (t) => {
          return (
            (parseInt(t.tenureSchool) || 0) * (parseInt(weights.tenureSchool) || 0) +
            (parseInt(t.tenureHomeroom) || 0) * (parseInt(weights.tenureHomeroom) || 0) +
            (parseInt(t.tenureDifficult) || 0) * (parseInt(weights.tenureDifficult) || 0) +
            (parseInt(t.tenureHead) || 0) * (parseInt(weights.tenureHead) || 0) +
            (parseInt(t.tenureTotal) || 0) * (parseInt(weights.tenureTotal) || 0) +
            (parseInt(t.tenureEtc) || 0) * (parseInt(weights.tenureEtc) || 0)
          );
        };

        const calculateSuitabilityScore = (teacher, grade) => {
          let score = 0;
          const prefIndex = teacher.gradePrefs.indexOf(grade);
          if (prefIndex !== -1) {
            const prefWeights = [
              parseInt(weights.pref1) || 0,
              parseInt(weights.pref2) || 0,
              parseInt(weights.pref3) || 0,
              parseInt(weights.pref4) || 0,
              parseInt(weights.pref5) || 0
            ];
            score += prefWeights[prefIndex] || 0;
          }
          score += (parseInt(teacher.tenureSchool) || 0) * (parseInt(weights.tenureSchool) || 0);
          score += (parseInt(teacher.tenureHomeroom) || 0) * (parseInt(weights.tenureHomeroom) || 0);
          if (difficultGrades.includes(grade)) {
            score += (parseInt(teacher.tenureDifficult) || 0) * (parseInt(weights.tenureDifficult) || 0);
            if (teacher.gradePrefs.includes(grade)) {
              score += (parseInt(weights.difficultBonus) || 0);
            }
          }
          score += (parseInt(teacher.tenureHead) || 0) * (parseInt(weights.tenureHead) || 0);
          score += (parseInt(teacher.tenureTotal) || 0) * (parseInt(weights.tenureTotal) || 0);
          score += (parseInt(teacher.tenureEtc) || 0) * (parseInt(weights.tenureEtc) || 0);
          return score;
        };

        return teachersList.map(t => {
          let reason = '';
          if (t.specialtyType === '교장' || t.specialtyType === '교감') {
            reason = `학교 관리자 (${t.specialtyType}) 직위에 따른 자동 임명`;
          } else if (t.assignedGrade !== null) {
            const slot = homerooms.find(hr => hr.grade === t.assignedGrade && hr.classNum === t.assignedClassNum);
            const isManual = slot && slot.manuallyAdjusted;
            
            if (isManual) {
              reason = `[수동조율] 관리자 수동 조율을 통한 ${t.assignedGrade}학년 ${t.assignedClassNum}반 배정 (소속: ${t.assignedDept || '미배정'})`;
            } else {
              const isGradeHead = (t.role === 'homeroom' || t.role === 'homeroom_head') && t.assignedClassNum === 1 && t.headPref && t.headPref.includes('부장');
              const suitabilityScore = calculateSuitabilityScore(t, t.assignedGrade);
              const careerScore = getCareerScore(t);
              const prefIdx = t.gradePreferenceRank;
              
              if (isGradeHead) {
                if (prefIdx !== -1) {
                  reason = `희망 보직(학년부장) 신청에 따른 ${t.assignedGrade}학년 1반(학년부장) 배정 및 학년부 자동 배치 (지망 순위: ${prefIdx + 1}지망, 매칭점수: ${suitabilityScore}점)`;
                } else {
                  reason = `희망 보직(학년부장) 신청에 따른 ${t.assignedGrade}학년 1반(학년부장) 임의 배정 및 학년부 배치 (매칭점수: ${suitabilityScore}점)`;
                }
              } else if (t.role === 'homeroom_head') {
                if (prefIdx !== -1) {
                  reason = `희망 보직(${t.headPref}) 선정에 따른 ${t.assignedGrade}학년 담임 배정 및 해당 부서 배치 (지망 순위: ${prefIdx + 1}지망, 매칭점수: ${suitabilityScore}점)`;
                } else {
                  reason = `희망 보직(${t.headPref}) 선정에 따른 ${t.assignedGrade}학년 담임 임의 배정 및 해당 부서 배치 (매칭점수: ${suitabilityScore}점)`;
                }
              } else if (t.isForcedHomeroom) {
                reason = `담임교사 정원 충족을 위한 의무 배정 (${t.assignedGrade}학년 ${t.assignedClassNum}반, 경력 종합점수: ${careerScore}점)`;
              } else {
                if (prefIdx !== -1) {
                  reason = `희망 ${prefIdx + 1}지망 학년(${t.assignedGrade}학년 ${t.assignedClassNum}반) 배정 (매칭점수: ${suitabilityScore}점)`;
                } else {
                  reason = `희망 학년 마감으로 인한 ${t.assignedGrade}학년 ${t.assignedClassNum}반 임의 배정 (경력 종합점수: ${careerScore}점)`;
                }
              }
            }
          } else {
            // Non-homeroom teachers
            if (t.role === 'head') {
              reason = `희망 보직(${t.headPref || '부장'}) 선정에 따른 ${t.assignedDept || '미배정'}장 지정 (담임 면제)`;
            } else if (t.role === 'specialty') {
              const comparers = ['보건교사', '영양교사', '상담교사', '사서교사', '특수교사'];
              if (t.specialtyType && comparers.includes(t.specialtyType)) {
                reason = `비교과 직렬(${t.specialtyType})에 따른 ${t.assignedDept || '미배정'} 자동 배치`;
              } else {
                reason = `전담 교과(${t.specialtyType || '일반전담'}) 지정을 통한 ${t.assignedDept || '미배정'} 전담교사 배치`;
              }
            } else {
              reason = `미배정 (기타 역할 및 대기)`;
            }
          }
          return { ...t, assignmentReason: reason };
        });
      };

      // CORE ALGORITHMS
      const runAutoAssignment = () => {
        if (totalClasses === 0) {
          showToast('배정할 학급 수가 0개입니다. 기본 설정을 확인해주세요.', 'error');
          return;
        }

        // Calculate career score helper
        const getCareerScore = (t) => {
          return (
            (parseInt(t.tenureSchool) || 0) * (parseInt(weights.tenureSchool) || 0) +
            (parseInt(t.tenureHomeroom) || 0) * (parseInt(weights.tenureHomeroom) || 0) +
            (parseInt(t.tenureDifficult) || 0) * (parseInt(weights.tenureDifficult) || 0) +
            (parseInt(t.tenureHead) || 0) * (parseInt(weights.tenureHead) || 0) +
            (parseInt(t.tenureTotal) || 0) * (parseInt(weights.tenureTotal) || 0) +
            (parseInt(t.tenureEtc) || 0) * (parseInt(weights.tenureEtc) || 0)
          );
        };

        // Deep copy teachers to avoid mutating registry state
        let localTeachers = JSON.parse(JSON.stringify(teachers));
        const originalHomeroomCandidatesCount = localTeachers.filter(t => t.role === 'homeroom' || t.role === 'homeroom_head').length;
        
        let forcedTeacherNames = [];

        if (originalHomeroomCandidatesCount < totalClasses) {
          const shortfall = totalClasses - originalHomeroomCandidatesCount;
          
          // Get all non-homeroom teachers
          const excludedSpecialties = ['교장', '교감', '특수교사', '보건교사', '영양교사', '상담교사', '사서교사'];
          let nonHomeroomTeachers = localTeachers.filter(t => 
            t.role !== 'homeroom' && 
            t.role !== 'homeroom_head' &&
            !t.fixedDept &&
            !(t.specialtyType && excludedSpecialties.some(spec => t.specialtyType.includes(spec)))
          );
          
          // Calculate career scores and assign a random tie-breaker
          nonHomeroomTeachers.forEach(t => {
            t.careerScore = getCareerScore(t);
            t.rand = Math.random();
          });
          
          // Sort by career score ascending (lowest score first), then random
          nonHomeroomTeachers.sort((a, b) => {
            if (a.careerScore !== b.careerScore) {
              return a.careerScore - b.careerScore;
            }
            return a.rand - b.rand;
          });
          
          // Select the first 'shortfall' teachers (those with the lowest scores)
          const forcedTargets = nonHomeroomTeachers.slice(0, shortfall);
          const forcedIds = new Set(forcedTargets.map(t => t.id));
          
          forcedTeacherNames = forcedTargets.map(t => t.name);

          // Update their roles locally (specialty -> homeroom, head -> homeroom_head)
          localTeachers = localTeachers.map(t => {
            if (forcedIds.has(t.id)) {
              let newRole = t.role;
              if (t.role === 'head') {
                newRole = 'homeroom_head';
              } else if (t.role === 'specialty') {
                newRole = 'homeroom';
              }
              return {
                ...t,
                role: newRole,
                isForcedHomeroom: true
              };
            }
            return t;
          });
        }

        // 1. Create Homeroom Slots
        const homeroomSlots = [];
        Object.keys(classCounts).forEach(grade => {
          const numGr = parseInt(grade);
          const count = classCounts[numGr];
          for (let i = 1; i <= count; i++) {
            homeroomSlots.push({
              id: `class-${numGr}-${i}`,
              grade: numGr,
              classNum: i,
              assignedTeacher: null,
              manuallyAdjusted: false
            });
          }
        });

        // 2. Filter Candidates for Homeroom (담임교사와 부장(담임)교사만 대상)
        let candidates = localTeachers.filter(t => t.role === 'homeroom' || t.role === 'homeroom_head').map(t => ({
          ...t,
          assignedGrade: null,
          assignedClassNum: null,
          gradePreferenceRank: -1
        }));

        const calculateSuitabilityScore = (teacher, grade, excludePreference = false) => {
          let score = 0;
          
          if (!excludePreference) {
            const prefIndex = teacher.gradePrefs.indexOf(grade);
            if (prefIndex !== -1) {
              const prefWeights = [
                parseInt(weights.pref1) || 0,
                parseInt(weights.pref2) || 0,
                parseInt(weights.pref3) || 0,
                parseInt(weights.pref4) || 0,
                parseInt(weights.pref5) || 0
              ];
              score += prefWeights[prefIndex] || 0;
            }
          }
          
          score += (parseInt(teacher.tenureSchool) || 0) * (parseInt(weights.tenureSchool) || 0);
          score += (parseInt(teacher.tenureHomeroom) || 0) * (parseInt(weights.tenureHomeroom) || 0);
          
          if (difficultGrades.includes(grade)) {
            score += (parseInt(teacher.tenureDifficult) || 0) * (parseInt(weights.tenureDifficult) || 0);
            if (!excludePreference && teacher.gradePrefs.includes(grade)) {
              score += (parseInt(weights.difficultBonus) || 0);
            }
          }
          
          score += (parseInt(teacher.tenureHead) || 0) * (parseInt(weights.tenureHead) || 0);
          score += (parseInt(teacher.tenureTotal) || 0) * (parseInt(weights.tenureTotal) || 0);
          score += (parseInt(teacher.tenureEtc) || 0) * (parseInt(weights.tenureEtc) || 0);
          return score;
        };

        // [NEW] Grade Head (학년부장) Pre-matching Logic
        const gradeHeadSlots = homeroomSlots.filter(s => s.classNum === 1);
        const gradeHeadCandidates = candidates.filter(c => c.role === 'homeroom_head' && c.headPref === '학년부장');
        
        let assignedGradeHeadsMap = {}; // teacherId -> slotId
        
        // Match Grade Heads by preference rank (1st to 5th choices)
        for (let choiceIdx = 0; choiceIdx < 5; choiceIdx++) {
          const unassignedSlots = gradeHeadSlots.filter(s => !s.assignedTeacher);
          if (unassignedSlots.length === 0) break;
          
          const slotsByGrade = unassignedSlots.reduce((acc, slot) => {
            acc[slot.grade] = slot;
            return acc;
          }, {});
          
          Object.keys(slotsByGrade).forEach(gradeStr => {
            const grade = parseInt(gradeStr);
            const slot = slotsByGrade[grade];
            
            const applicants = gradeHeadCandidates.filter(c => {
              return !assignedGradeHeadsMap[c.id] && c.gradePrefs[choiceIdx] === grade;
            });
            
            if (applicants.length === 0) return;
            
            // Rank applicants by suitability score
            applicants.forEach(a => {
              a.currentScore = calculateSuitabilityScore(a, grade);
            });
            
            applicants.sort((a, b) => {
              if (b.currentScore !== a.currentScore) return b.currentScore - a.currentScore;
              return a.id.localeCompare(b.id);
            });
            
            const teacher = applicants[0];
            slot.assignedTeacher = teacher.id;
            assignedGradeHeadsMap[teacher.id] = slot.id;
            
            // Update candidate details
            candidates = candidates.map(c => {
              if (c.id === teacher.id) {
                return {
                  ...c,
                  assignedGrade: slot.grade,
                  assignedClassNum: slot.classNum,
                  gradePreferenceRank: choiceIdx
                };
              }
              return c;
            });
          });
        }
        
        // Greedy assignment for remaining unassigned Grade Head candidates/slots
        let unassignedGHSlots = gradeHeadSlots.filter(s => !s.assignedTeacher);
        let unassignedGHCandidates = gradeHeadCandidates.filter(c => !assignedGradeHeadsMap[c.id]);
        
        if (unassignedGHSlots.length > 0 && unassignedGHCandidates.length > 0) {
          let remainingSlots = [...unassignedGHSlots];
          while (remainingSlots.length > 0) {
            const remainingHeads = gradeHeadCandidates.filter(c => !assignedGradeHeadsMap[c.id]);
            if (remainingHeads.length === 0) break;
            
            let bestMatch = null;
            for (let slot of remainingSlots) {
              for (let teacher of remainingHeads) {
                const score = calculateSuitabilityScore(teacher, slot.grade, true);
                if (!bestMatch || score > bestMatch.score) {
                  bestMatch = {
                    slot: slot,
                    teacherId: teacher.id,
                    score: score
                  };
                }
              }
            }
            
            if (bestMatch) {
              const assignedSlot = remainingSlots.find(s => s.id === bestMatch.slot.id);
              assignedSlot.assignedTeacher = bestMatch.teacherId;
              assignedGradeHeadsMap[bestMatch.teacherId] = assignedSlot.id;
              
              const prefIndex = remainingHeads.find(h => h.id === bestMatch.teacherId).gradePrefs.indexOf(assignedSlot.grade);
              candidates = candidates.map(c => {
                if (c.id === bestMatch.teacherId) {
                  return {
                    ...c,
                    assignedGrade: assignedSlot.grade,
                    assignedClassNum: assignedSlot.classNum,
                    gradePreferenceRank: prefIndex
                  };
                }
                return c;
              });
              
              remainingSlots = remainingSlots.filter(s => s.id !== assignedSlot.id);
            } else {
              break;
            }
          }
        }

        // Alg 1: Tenure-First (경력 종합점수 우선)
        const runScoreFirstMatching = () => {
          let remainingSlots = homeroomSlots.filter(s => !s.assignedTeacher);
          let assignedTeachersMap = {};
          // Pre-populate with pre-matched Grade Heads
          candidates.forEach(c => {
            if (c.assignedGrade !== null && c.assignedClassNum !== null) {
              const slotId = `class-${c.assignedGrade}-${c.assignedClassNum}`;
              assignedTeachersMap[c.id] = slotId;
            }
          });

          while (remainingSlots.length > 0) {
            let bestMatch = null;
            const unassignedCandidates = candidates.filter(c => !assignedTeachersMap[c.id]);
            if (unassignedCandidates.length === 0) break;

            for (let slot of remainingSlots) {
              for (let teacher of unassignedCandidates) {
                const score = calculateSuitabilityScore(teacher, slot.grade);
                if (!bestMatch || score > bestMatch.score) {
                  bestMatch = {
                    slot: slot,
                    teacherId: teacher.id,
                    score: score
                  };
                }
              }
            }

            if (bestMatch) {
              const assignedSlot = remainingSlots.find(s => s.id === bestMatch.slot.id);
              assignedSlot.assignedTeacher = bestMatch.teacherId;
              assignedTeachersMap[bestMatch.teacherId] = assignedSlot.id;

              candidates = candidates.map(c => {
                if (c.id === bestMatch.teacherId) {
                  const prefIndex = c.gradePrefs.indexOf(assignedSlot.grade);
                  return {
                    ...c,
                    assignedGrade: assignedSlot.grade,
                    assignedClassNum: assignedSlot.classNum,
                    gradePreferenceRank: prefIndex
                  };
                }
                return c;
              });
              remainingSlots = remainingSlots.filter(s => s.id !== bestMatch.slot.id);
            } else {
              break;
            }
          }
        };

        // Alg 2: Preference-First (희망 순위 우선 매칭)
        const runPrefFirstMatching = () => {
          let assignedTeachersMap = {};
          // Pre-populate with pre-matched Grade Heads
          candidates.forEach(c => {
            if (c.assignedGrade !== null && c.assignedClassNum !== null) {
              const slotId = `class-${c.assignedGrade}-${c.assignedClassNum}`;
              assignedTeachersMap[c.id] = slotId;
            }
          });
          
          // Loop through choices: 1st choice down to 5th choice
          for (let choiceIdx = 0; choiceIdx < 5; choiceIdx++) {
            // Find all unassigned slots
            const unassignedSlots = homeroomSlots.filter(s => !s.assignedTeacher);
            if (unassignedSlots.length === 0) break;

            // Group unassigned slots by grade
            const slotsByGrade = unassignedSlots.reduce((acc, slot) => {
              acc[slot.grade] = acc[slot.grade] || [];
              acc[slot.grade].push(slot);
              return acc;
            }, {});

            // For each grade with unassigned slots, find candidates who chose it as their (choiceIdx + 1)th preference
            Object.keys(slotsByGrade).forEach(gradeStr => {
              const grade = parseInt(gradeStr);
              const availableSlots = slotsByGrade[grade];
              
              // Find unassigned teachers whose choiceIdx preference matches this grade
              const gradeApplicants = candidates.filter(c => {
                return !assignedTeachersMap[c.id] && c.gradePrefs[choiceIdx] === grade;
              });

              if (gradeApplicants.length === 0) return;

              // Calculate suitability score without preference weight to rank candidates competing for the same preference
              gradeApplicants.forEach(c => {
                c.currentScore = calculateSuitabilityScore(c, grade, true);
              });

              // Sort applicants by suitability score
              gradeApplicants.sort((a, b) => b.currentScore - a.currentScore);

              // Assign slots to the top applicants
              const assignCount = Math.min(availableSlots.length, gradeApplicants.length);
              for (let i = 0; i < assignCount; i++) {
                const slot = availableSlots[i];
                const teacher = gradeApplicants[i];

                slot.assignedTeacher = teacher.id;
                assignedTeachersMap[teacher.id] = slot.id;

                candidates = candidates.map(c => {
                  if (c.id === teacher.id) {
                    return {
                      ...c,
                      assignedGrade: slot.grade,
                      assignedClassNum: slot.classNum,
                      gradePreferenceRank: choiceIdx
                    };
                  }
                  return c;
                });
              }
            });
          }

          // Assign remaining unassigned slots and teachers greedily using tenure-only scores
          let unassignedSlots = homeroomSlots.filter(s => !s.assignedTeacher);
          while (unassignedSlots.length > 0) {
            let bestMatch = null;
            const unassignedCandidates = candidates.filter(c => !assignedTeachersMap[c.id]);
            if (unassignedCandidates.length === 0) break;

            for (let slot of unassignedSlots) {
              for (let teacher of unassignedCandidates) {
                const score = calculateSuitabilityScore(teacher, slot.grade, true);
                if (!bestMatch || score > bestMatch.score) {
                  bestMatch = {
                    slot: slot,
                    teacherId: teacher.id,
                    score: score
                  };
                }
              }
            }

            if (bestMatch) {
              const assignedSlot = unassignedSlots.find(s => s.id === bestMatch.slot.id);
              assignedSlot.assignedTeacher = bestMatch.teacherId;
              assignedTeachersMap[bestMatch.teacherId] = assignedSlot.id;

              candidates = candidates.map(c => {
                if (c.id === bestMatch.teacherId) {
                  const prefIndex = c.gradePrefs.indexOf(assignedSlot.grade);
                  return {
                    ...c,
                    assignedGrade: assignedSlot.grade,
                    assignedClassNum: assignedSlot.classNum,
                    gradePreferenceRank: prefIndex
                  };
                }
                return c;
              });
              unassignedSlots = unassignedSlots.filter(s => s.id !== bestMatch.slot.id);
            } else {
              break;
            }
          }
        };

        if (algorithmOption === 'prefFirst') {
          runPrefFirstMatching();
        } else {
          runScoreFirstMatching();
        }

                // --- Department Assignment Section ---
        // Build finalTeachersMap before department assignment
        const finalTeachersMap = {};
        candidates.forEach(c => {
          finalTeachersMap[c.id] = c;
        });
        localTeachers.forEach(orig => {
          if (!finalTeachersMap[orig.id]) {
            finalTeachersMap[orig.id] = {
              ...orig,
              assignedGrade: null,
              assignedClassNum: null,
              gradePreferenceRank: -1
            };
          }
        });

        // Run department assignment
        const deptResults = computeDepartmentAssignments(homeroomSlots, Object.values(finalTeachersMap));

        const teachersWithReasons = computeAssignmentReasons(homeroomSlots, deptResults.teachers);

        const finalResults = {
          timestamp: new Date().toLocaleString(),
          homerooms: homeroomSlots.map(slot => ({
            ...slot,
            teacher: teachersWithReasons.find(t => t.id === slot.assignedTeacher) || null
          })),
          departments: deptResults.departments.map(dept => ({
            ...dept,
            headTeacher: teachersWithReasons.find(t => t.id === (dept.headTeacher ? dept.headTeacher.id : null)) || null,
            memberTeachers: dept.memberTeachers.map(m => teachersWithReasons.find(t => t.id === m.id) || m)
          })),
          teachers: teachersWithReasons
        };

        setAssignmentResult(finalResults);

        setActiveTab('results');
        if (forcedTeacherNames.length > 0) {
          showToast(`담임 교원 부족으로 경력 점수가 낮은 교사(${forcedTeacherNames.join(', ')})가 담임으로 강제 지정되어 배정되었습니다.`, 'warning');
        } else {
          showToast('학급 담임 및 업무분장이 성공적으로 배정되었습니다!', 'success');
        }
      };

      // MANUAL RESULT SWAP/TWEAK HANDLER
      const handleManualSwap = (slotId, targetTeacherId) => {
        if (!assignmentResult) return;

        const updatedResult = JSON.parse(JSON.stringify(assignmentResult));
        const slot = updatedResult.homerooms.find(hr => hr.id === slotId);
        if (!slot) return;

        const oldTeacher = slot.teacher;
        
        if (targetTeacherId === 'unassigned') {
          // Action: Unassign current teacher
          slot.teacher = null;
          slot.manuallyAdjusted = true;
          
          if (oldTeacher) {
            const t = updatedResult.teachers.find(teacher => teacher.id === oldTeacher.id);
            if (t) {
              t.assignedGrade = null;
              t.assignedClassNum = null;
              t.gradePreferenceRank = -1;
            }
          }
        } else {
          const selectedTeacher = updatedResult.teachers.find(t => t.id === targetTeacherId);
          if (!selectedTeacher) return;

          const previousGrade = selectedTeacher.assignedGrade;
          const previousClassNum = selectedTeacher.assignedClassNum;

          if (previousGrade !== null) {
            // Selected teacher was already assigned elsewhere -> Swap teachers!
            const otherSlot = updatedResult.homerooms.find(hr => hr.grade === previousGrade && hr.classNum === previousClassNum);
            
            if (otherSlot) {
              otherSlot.teacher = oldTeacher;
              otherSlot.manuallyAdjusted = true;
            }
            
            slot.teacher = selectedTeacher;
            slot.manuallyAdjusted = true;

            // Update teachers mapping
            const tNew = updatedResult.teachers.find(t => t.id === selectedTeacher.id);
            if (tNew) {
              tNew.assignedGrade = slot.grade;
              tNew.assignedClassNum = slot.classNum;
              tNew.gradePreferenceRank = tNew.gradePrefs.indexOf(slot.grade);
            }

            if (oldTeacher) {
              const tOld = updatedResult.teachers.find(t => t.id === oldTeacher.id);
              if (tOld) {
                tOld.assignedGrade = previousGrade;
                tOld.assignedClassNum = previousClassNum;
                tOld.gradePreferenceRank = tOld.gradePrefs.indexOf(previousGrade);
              }
            }
          } else {
            // Selected teacher was unassigned -> Simply assign them and make old teacher unassigned
            slot.teacher = selectedTeacher;
            slot.manuallyAdjusted = true;

            const tNew = updatedResult.teachers.find(t => t.id === selectedTeacher.id);
            if (tNew) {
              tNew.assignedGrade = slot.grade;
              tNew.assignedClassNum = slot.classNum;
              tNew.gradePreferenceRank = tNew.gradePrefs.indexOf(slot.grade);
            }

            if (oldTeacher) {
              const tOld = updatedResult.teachers.find(t => t.id === oldTeacher.id);
              if (tOld) {
                tOld.assignedGrade = null;
                tOld.assignedClassNum = null;
                tOld.gradePreferenceRank = -1;

            }

        updatedResult.departments = deptResults.departments.map(dept => ({

        updatedResult.homerooms.forEach(hr => {

                      <tr key={dept.name}>
                        <td style={{ fontWeight: 'bold', backgroundColor: '#f8fafc' }}>{dept.name} (정원: {dept.capacity}명)</td>
                        <td>
                          {dept.name === '학년부' ? (
                            (() => {
                              const gradeHeads = dept.memberTeachers.filter(m => m.headPref && m.headPref.includes('학년부장'));
                              // Sort by grade
                              gradeHeads.sort((a, b) => (parseInt(a.headPref) || 0) - (parseInt(b.headPref) || 0));
                              if (gradeHeads.length === 0) return <span style={{ color: '#ef4444', fontWeight: 'bold' }}>공석</span>;
                              return (
                                <div style={{ display: 'flex', flexDirection: 'column', gap: '2px', alignItems: 'center', fontSize: '9px' }}>
                                  {gradeHeads.map(h => (
                                    <span key={h.id} style={{ display: 'block' }}>
                                      <strong>{h.name}</strong>({h.headPref})
                                    </span>
                                  ))}
                                </div>
                              );
                            })()
                          ) : dept.headTeacher ? (
                            <span>
                              <strong>{dept.headTeacher.name}</strong>
                              {dept.headTeacher.role === 'homeroom_head' ? ' (담임겸임)' : ' (전담)'}
                            </span>
                          ) : (
                            <span style={{ color: '#ef4444', fontWeight: 'bold' }}>공석</span>
                          )}
                        </td>
                        <td style={{ textAlign: 'left', padding: '6px 10px' }}>
                          {(() => {
                            const displayMembers = (dept.name === '학년부'
                              ? dept.memberTeachers.filter(m => !m.headPref || !m.headPref.includes('학년부장'))
                              : dept.memberTeachers)
                              .filter(m => m.specialtyType !== '교장' && m.specialtyType !== '교감');
                            
                            if (displayMembers && displayMembers.length > 0) {
                              return displayMembers.map(m => {
                                let roleLabel = '';
                                if (m.role === 'homeroom') roleLabel = ' (담임)';
                                else if (m.role === 'specialty') roleLabel = ' (전담)';
                                return `${m.name}${roleLabel}`;
                              }).join(', ');
                            } else {
                              return <span style={{ color: '#94a3b8', fontStyle: 'italic' }}>배정 부원 없음</span>;
                            }
                          })()}
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
              
              <div style={{ marginTop: '20px', textAlign: 'center', fontSize: '9px', color: '#64748b' }}>
                 본 문서는 {schoolName} 교무조직 설계 및 학급담임 매칭 엔진으로 자동 생성되었습니다.
              </div>
            </div>
          )}
        </div>
      );
    }

    // Mount React App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
